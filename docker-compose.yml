version: '3.8'

services:
  # 1. Data Base
  db:
    image: postgres:15-alpine
    container_name: dulfi_db
    restart: always
    environment:
      POSTGRES_USER: user_dulfi
      POSTGRES_PASSWORD: password_dulfi
      POSTGRES_DB: dulfi_video_db
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_dulfi -d dulfi_video_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    volumes:
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data

  # 2. Backend
  server:
    build: ./server
    container_name: dulfi_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - DATABASE_URL=postgres://user_dulfi:password_dulfi@db:5432/dulfi_video_db
      - PORT=5000
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./server:/usr/src/app
      - /usr/src/app/node_modules
      - ./server/uploads:/usr/src/app/uploads
      - ./shared:/usr/src/app/shared
      

  # 3. Frontend
  client:
    build: ./client
    container_name: dulfi_frontend
    restart: always
    ports:
      - "3000:3000"
    depends_on:
      - server
    volumes:
      - ./client:/usr/src/app
      - /usr/src/app/node_modules
      - ./shared:/usr/src/shared

volumes:
  postgres_data: